name: LeoCAD Harmony Port CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  port-policy:
    name: Port baseline policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -f cmake/LeoCADSources.cmake
          test -f toolchain.lock
          test -f docs/D1_BASELINE.md
          test -f docs/STORE_SUBMISSION_CHECKLIST.md
          grep -q '^UPSTREAM_TAG=v26.09$' toolchain.lock
          grep -q '^TARGET_ARCH=arm64-v8a$' toolchain.lock
          ! git ls-files | grep -E '\.(p12|p7b|cer|hap|app)$'
      - name: Check source list paths
        shell: pwsh
        run: |
          $content = Get-Content cmake/LeoCADSources.cmake -Raw
          $paths = [regex]::Matches($content, '(?m)^\s+((common|qt|resources)/[^\s\)]+)') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $missing = $paths | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing source-list files: $($missing -join ', ')" }
      - name: Check first-release scope against the offline claim
        shell: bash
        # The privacy policy promises no network requests and no INTERNET
        # permission. That holds because every path into common/lc_http.cpp is
        # trimmed from the menus and the update check is compiled out — not
        # because there is no network code. Both can regress silently, and the
        # first symptom would be a store reviewer watching the app reach
        # leocad.org, so they get asserted here instead of being remembered.
        run: |
          set -euo pipefail
          python3 scripts/library/test_network_scope.py
          python3 scripts/library/test_export_part_list.py
          python3 scripts/library/test_packaged_resources.py

  desktop-build:
    name: Qt 6.12 desktop compile regression
    runs-on: ubuntu-latest
    needs: port-policy
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.*"
          cache: true
      - name: Configure
        run: cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEOCAD_TEST_RESOURCE_PATHS=ON
      - name: Build
        run: cmake --build build/desktop --parallel 2
      - name: Test help/version with Harmony resource diagnostics enabled
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Upload startup regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-regression-${{ github.sha }}
          path: |
            build/desktop/startup-results.json
            build/desktop/Testing/Temporary/LastTest.log

  harmony-toolchain-note:
    name: HarmonyOS packaging gate
    runs-on: ubuntu-latest
    needs: port-policy
    steps:
      - uses: actions/checkout@v4
      - name: Record packaging status
        shell: bash
        run: |
          status=$(sed -n 's/^QT_HARMONYOS_STATUS=//p' toolchain.lock)
          echo "Qt for HarmonyOS status: ${status}"
          echo "HAP is built on the controlled DevEco/Qt toolchain after Qt installation."
